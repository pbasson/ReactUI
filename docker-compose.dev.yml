services:
  myapp:
    image: reactui:dev
    build:
      target: development
    environment:
      NODE_ENV: development
    # Refresh the dependency volume from the lockfile whenever the container starts.
    command: sh -c "npm ci && exec npm run dev -- --hostname 0.0.0.0 --port 3001"
    volumes:
      - ./src:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next
    networks:
      - mysqlcore_network
volumes:
  dev_node_modules:
  dev_next:

networks:
  mysqlcore_network:
    name: mysqlcore_network
    external: true