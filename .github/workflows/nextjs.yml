name: Build Next.js and Docker image

on:
  push:
    branches: [development]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      IMAGE_TAG: reactui:${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Build Next.js
        working-directory: src
        run: npm run build

      - name: Build production Docker image
        run: docker build --target runtime --file src/Dockerfile --tag "$IMAGE_TAG" src

      - name: Smoke-test production container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name reactui-smoke --publish 127.0.0.1:3001:3001 "$IMAGE_TAG"
          trap 'docker logs reactui-smoke; docker rm --force reactui-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null --max-time 5 http://127.0.0.1:3001; then
              echo "Production homepage returned a successful response."
              exit 0
            fi
            sleep 2
          done
          echo "Production container did not become ready."
          exit 1

      - name: Export deployment image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker save "$IMAGE_TAG" | gzip > artifacts/reactui-image.tar.gz
          printf '%s\n' "$IMAGE_TAG" > artifacts/image-tag.txt
          cd artifacts
          sha256sum reactui-image.tar.gz > SHA256SUMS

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v6
        with:
          name: reactui-image-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
